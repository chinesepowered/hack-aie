<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 50% 40%,#fff8ec 0%,#fbf1e2 55%,#f3e4cf 100%);font-family:Inter,sans-serif;color:#2e241c;overflow:hidden}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
img{width:230px;animation:drop 1.1s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 18px 24px rgba(90,55,20,.25))}
h1{font-family:Fraunces,serif;font-size:118px;margin:10px 0 0;letter-spacing:-2px;animation:up .9s .45s both}
.tag{font-size:34px;color:#b8670a;font-weight:600;margin-top:2px;animation:up .9s .75s both}
.sub{font-size:22px;color:#6b5a4b;margin-top:22px;animation:up .9s 1.05s both}
.chips{display:flex;gap:10px;margin-top:46px;flex-wrap:wrap;justify-content:center;max-width:1200px;animation:up .9s 1.4s both}
.chips span{background:#fff;border:1px solid #eadfd0;border-radius:999px;padding:8px 16px;font-weight:600;font-size:16px;color:#5b4b3d}
@keyframes drop{from{transform:translateY(-140px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
</style></head><body><div class="w">
<img src="/static/img/capy_logo.png"><h1>Capy Kondo</h1><div class="tag">Make room for what matters.</div>
<div class="sub">Point a camera at your clutter. A very chill capybara sells it for you.</div>
<div class="chips"><span>Meta Muse Spark</span><span>Meta SAM 3.1</span><span>Gemini 4 Argon</span><span>Nano Banana 2.1</span><span>SubQ Snap 1.1</span><span>Fetch.ai · Agentverse · ASI:One</span></div>
</div></body></html>
